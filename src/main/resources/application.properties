spring.application.name=apipizaria2

# Configuration da Porta para o Render (Fundamental)
server.port=${PORT:8080}

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:pizzariadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Springdoc / Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Pagination Defaults
spring.data.web.pageable.default-page-size=10

# Springdoc - Suprime schemas genéricos de resposta e schemas internos do HATEOAS
springdoc.override-with-generic-response=false
springdoc.writer-with-default-pretty-printer=true